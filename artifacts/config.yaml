model:
  _target_: src.model.transformer.CodeTransformer
  vocab_size: 16384
  dim: 768
  heads: 12
  hidden: 2048
  encoder_layers: 8
  decoder_layers: 4
  dropout: 0.1
  max_length: 256
  activation_checkpointing: false
  qk_norm: true
hardware:
  micro_batch: 64
  accumulation: 4
  workers: 8
  precision: bf16
seed: 42
data_dir: /tmp/codegen107_256/processed
run_dir: /tmp/codegen107_256/saved/h100_256
resume: null
device: cuda
optimizer:
  lr: 0.0001
  min_lr_ratio: 0.1
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
trainer:
  max_steps: 90000
  warmup_steps: 1000
  max_hours: 5.0
  calibrate_budget: true
  calibration_steps: 100
  clip_grad_norm: 1.0
  log_every: 20
  eval_every: 1000
  save_every: 1000
  val_examples: 4096
  generation_examples: 128
  generation_max_tokens: 256
  loss_chunk_size: 1024
  tensorboard: false
