defaults:
  - model: code107m
  - hardware: h100
  - _self_
seed: 42
data_dir: data/processed
run_dir: saved/first_train
resume: null
device: cuda
optimizer:
  lr: 0.0004
  min_lr_ratio: 0.1
  betas: [0.9, 0.95]
  weight_decay: 0.1
trainer:
  max_steps: 90000
  warmup_steps: 1000
  max_hours: 23.0
  calibrate_budget: true
  calibration_steps: 100
  clip_grad_norm: 1.0
  log_every: 20
  eval_every: 1000
  save_every: 1000
  val_examples: 4096
  generation_examples: 128
  generation_max_tokens: 384
  loss_chunk_size: 1024
  tensorboard: true
hydra:
  run:
    dir: ${run_dir}/hydra
  job:
    chdir: false
